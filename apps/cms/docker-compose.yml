services:
  postgres:
    image: postgres:16-alpine
    container_name: wasi-payload-db
    restart: always
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: payload
    ports:
      # Localhost-only, so `pnpm dev` on the host can reach Postgres.
      # The `payload` service still connects via the internal `postgres` hostname.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payload -d payload"]
      interval: 5s
      timeout: 5s
      retries: 10

  payload:
    build:
      context: ../..
      dockerfile: apps/cms/Dockerfile
    container_name: wasi-payload-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://payload:${POSTGRES_PASSWORD}@postgres:5432/payload
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
    ports:
      - "3000:3000"
    volumes:
      # Persist uploaded media. Payload's default staticDir is `media` relative to
      # cwd (= /repo/apps/cms in the container), so mount the volume there.
      - media:/repo/apps/cms/media

volumes:
  pgdata:
  media: